function matrix_unused(m){

  const names=['drone','bird','balloon','clutter','other'];
  return `<div class="table-wrap"><table class="matrix"><thead><tr><th>True / predicted</th>${names.map(key=>`<th>${C[key]}</th>`).join('')}</tr></thead><tbody>${m.map((row,actual)=>{
    const total=Math.max(1,row.reduce((sum,value)=>sum+Number(value||0),0));
    return `<tr><th>${C[names[actual]]}</th>${row.map((value,predicted)=>{
      const count=Number(value||0), ratio=count/total, correct=actual===predicted, clickable=!correct&&count>0;
      const alpha=count ? .12+.78*ratio : .04, rgb=count?(correct?'5,150,105':'220,38,38'):'148,163,184';
      const attrs=clickable
        ? `class="matrix-error" data-confusion-case="1" data-actual="${actual}" data-predicted="${predicted}" role="button" tabindex="0" title="Click to view misclassified trajectories"`
        : `class="${count?(correct?'matrix-tp':'matrix-error-static'):'matrix-empty'}"`;
      return `<td ${attrs} style="background:rgba(${rgb},${alpha});color:${alpha>.48?'white':'#172033'}">${count}</td>`;
    }).join('')}</tr>`;
  }).join('')}</tbody></table></div>`;
}

    if(cached){target.innerHTML=cached;bindDecisionGroups(target);return}
    const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);
    target.innerHTML='<div class="empty">正在读取判断记录…</div>';
    try{
      const response=await fetch(`/api/experiments/${encodeURIComponent(x.name)}/decisions?branch=${branch}&source=${view}&errors_only=${errorsOnly?1:0}&limit=100`,{cache:'no-store',signal:controller.signal}),payload=await response.json();
      if(!response.ok)throw Error(payload.error||response.status);
      const html=decisionTableHtml(payload.items||[],payload.total||0,branch,view,errorsOnly);
      decisionViewCache.set(cacheKey,html);
      const current=$('#decision-table');
      if(current?.dataset.branch===branch&&sel===x.name){current.innerHTML=html;bindDecisionGroups(current)}
      else {target.innerHTML=html;bindDecisionGroups(target)}

      const html=`<div class="error-box">${error.name==='AbortError'?'读取超时，请稍后重试':E(error.message)}</div>`;
      const current=$('#decision-table');
      if(current?.dataset.branch===branch&&sel===x.name)current.innerHTML=html;
      else target.innerHTML=html;
    }
    finally{clearTimeout(timeout)}
  }

// The legacy bootstrap starts a polling timer before the richer monitor
// implementation below is installed.  Requests to /api/trainings can then
// overlap, and an older response may replace a newer one.  Share one in-flight
// request so queue entries cannot flash in and out of the directory.
(() => {
  const nativeFetch=window.fetch.bind(window);
  let trainingsRequest=null;
  window.fetch=(input,init)=>{
    const url=String(typeof input==='string'?input:input?.url||'');
    const method=String(init?.method||input?.method||'GET').toUpperCase();
    // Only coalesce the read-only experiment directory listing.  Mutating
    // endpoints such as rename, restart, resume and cancel must receive their
    // own Response object; sharing one would make response.json() fail with
    // "body stream already read" when polling consumes it first.
    const isDirectoryRead=method==='GET'&&/\/api\/trainings(?:\?|$)/.test(url);
    if(!isDirectoryRead)return nativeFetch(input,init);
    if(trainingsRequest)return trainingsRequest;
    trainingsRequest=nativeFetch(input,init).finally(()=>{trainingsRequest=null});
    return trainingsRequest;
  };

// Keep just-created scheduler records visible while the backend finishes its
// artifact scan. Both legacy and current pollers use this helper.
function mergePendingTrainings(next){
  const now=Date.now();
  const registry=window.__riPendingCreates||(window.__riPendingCreates=new Map());
  for(const [name,item] of registry){
    if(next.some(serverItem=>serverItem.name===name))registry.delete(name);
    else if(now-Number(item.optimistic_at||now)>=5*60*1000)registry.delete(name);
  }
  const pending=[...(data||[]),...registry.values()].filter(item=>item?.optimistic && item.name &&
    !next.some(serverItem=>serverItem.name===item.name) &&
    now-Number(item.optimistic_at||now)<5*60*1000).filter((item,index,array)=>array.findIndex(v=>v.name===item.name)===index);
  return pending.length?[...pending,...next]:next;
}
// The first page bootstrap installed a legacy interval before the current
// refresh function was defined. Reconcile its occasional stale replacement
// quickly so a successful create cannot disappear between scans.
if(!window.__riPendingReconcile){
  window.__riPendingReconcile=setInterval(()=>{
    const registry=window.__riPendingCreates;
    if(!registry?.size)return;
    const now=Date.now();let changed=false;
    for(const [name,item] of registry){
      if(now-Number(item.optimistic_at||now)>=5*60*1000){registry.delete(name);continue}
      if(!data.some(value=>value.name===name)){data.unshift(item);changed=true}
    }
    if(changed){renderList();renderMain()}
  },200);
}

    const c=item?.config||item?.params||{};
    const needsDiagnostics=Boolean(c.partition_augmentation_diagnostics?.enabled ||
      c.partition_augmentation_targets_val || c.partition_augmentation_targets_test);
    if(!item||!needsDiagnostics)return;

    if(now-last<5000)return;

      const payload=await response.json();

async function resumeFailed(x){
  if(!x?.resume_available)return;
  const history=x.history||[],completed=history.length?Math.max(...history.map(row=>Number(row.epoch)||0)):0,bestEpoch=Number(x.best?.epoch)||0;
  const legacy=x.resume_mode==='legacy_best_warm_start';
  const message=legacy
    ? `该任务没有完整的 last.pt。只能从第 ${bestEpoch||'--'} 轮最佳权重近似恢复，优化器状态无法恢复。\n\n是否继续？`
    : `将从第 ${completed||'--'} 轮结束时保存的完整断点严格继续。实验编号和目录保持不变。\n\n是否继续？`;
  if(!confirm(message))return;
  const button=document.querySelector('#resume-failed'),done=riButtonBusy(button,'正在续训…');
  riActionToast('正在校验断点并将原实验重新加入队列…');
  try{
    const response=await fetch(`/api/trainings/${encodeURIComponent(x.name)}/resume`,{method:'POST'}),result=await response.json();
    if(!response.ok)throw Error(result.error||response.status);
    const current=data.find(item=>item.name===x.name);
    if(current){Object.assign(current,{status:'queued',running:false,queue_id:result.queue_id,queue_position:null,error:'',resume_count:result.resume_count,progress:{phase:'preparing',stage:'resume_checkpoint',epoch:completed,total_epochs:current.config?.epochs||current.params?.epochs}});renderList();renderMain()}
    riActionToast(`已接受原地续训（第 ${result.resume_count||1} 次），正在等待调度启动。`,'ok');
    refreshAll();
  }catch(error){riActionToast(`断点续训失败：${error.message||error}`,'error')}
  finally{done()}
}

// Some legacy fusion renderers replace #main directly.  Preserve every
// independently scrollable table in the selected detail before *any* render
// implementation runs, then restore by panel heading afterwards.  This is
// intentionally outside the RD/TR renderer so fusion evaluations follow the
// same scrolling contract.
(() => {
  const priorRenderMain = renderMain;
  renderMain = function(){
    const main=$('#main');
    const scrollState=[...main.querySelectorAll('.panel')].map((panel,index)=>{
      const heading=panel.querySelector('h3')?.textContent?.trim()||`panel-${index}`;
      return [heading,[...panel.querySelectorAll('.table-wrap')].map(node=>node.scrollTop)];
    });
    const pageScroll=main.scrollTop;
    priorRenderMain();
    requestAnimationFrame(()=>{
      main.scrollTop=pageScroll;
      const used=new Map();
      for(const panel of main.querySelectorAll('.panel')){
        const heading=panel.querySelector('h3')?.textContent?.trim();
        const occurrence=used.get(heading)||0;used.set(heading,occurrence+1);
        const match=scrollState.filter(([name])=>name===heading)[occurrence];
        if(!match)continue;
        panel.querySelectorAll('.table-wrap').forEach((node,index)=>{node.scrollTop=match[1][index]||0});
      }
    });
  };
})();
